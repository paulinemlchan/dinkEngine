{% extends "base.html" %}
{% block content %}
<h1>Courts</h1>
{% include "admin/_nav.html" %}

<form method="post" class="inline-form">
  <label>Number of courts
    <input type="number" name="count" min="0" max="{{ max_courts }}" value="{{ courts|length }}">
  </label>
  <button type="submit">Save</button>
</form>

<ul>
  {% for c in courts %}<li>{{ c.name }}</li>{% else %}<li>No courts configured yet.</li>{% endfor %}
</ul>
{% endblock %}
