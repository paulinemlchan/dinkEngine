{% extends "base.html" %}
{% block content %}
<h1>Courts</h1>
{% include "admin/_nav.html" %}

<form method="post" class="inline-form">
  <label>Number of courts
    <input type="number" name="count" min="0" max="{{ max_courts }}" value="{{ courts|length }}">
  </label>
  <button type="submit">Save</button>
</form>

<ul class="player-list">
  {% for c in courts %}
    <li>
      <form method="post" action="{{ url_for('admin.rename_court', court_id=c.id) }}" class="inline-form">
        <input type="text" name="name" value="{{ c.name }}" maxlength="80" required>
        <button type="submit">Rename</button>
      </form>
    </li>
  {% else %}
    <li>No courts configured yet.</li>
  {% endfor %}
</ul>
{% endblock %}
